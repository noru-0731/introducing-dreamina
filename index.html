<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introducing Dreamina</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#000; --text:#F5F5F7; --sub:#86868B; --note:#A1A1A6; --accent:#AEC6B0; --line:#48484A; --card:#1C1C1E; --edge:#3A3A3C;
  --ease:cubic-bezier(.22,1,.36,1); --swap:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;word-break:keep-all}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:var(--bg);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(.985);filter:blur(6px);transition:opacity .7s var(--ease),transform 1.1s var(--ease),filter .7s var(--ease),visibility 0s linear .7s}
.slide.cur{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .7s var(--ease),transform 1.1s var(--ease),filter .7s var(--ease),visibility 0s}
/* 들어오는 움직임: 영상과 같은 0.5초, 24px 떠오름 */
.a{opacity:0;transform:translate3d(0,24px,0);transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:var(--d,0s)}
.a.on{opacity:1;transform:none}
.a.sm{transform:translate3d(0,12px,0)}
.a.sm.on{transform:none}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.label{font-size:30px;font-weight:600;color:var(--accent)}
.hero{font-size:150px;font-weight:700;letter-spacing:-0.02em;line-height:1.05}
.hero span{display:inline-block}
.sub{font-size:34px;font-weight:500;color:var(--note)}
.glow{position:absolute;left:50%;top:50%;width:1400px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(174,198,176,.10),rgba(174,198,176,0));opacity:0;transition:opacity 2.4s var(--ease)}
.cur .glow{opacity:1}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0;transition:opacity 2s var(--ease)}
.cur .orb{opacity:1}
.orb.o1{width:620px;height:620px;left:260px;top:180px;background:rgba(174,198,176,.16);animation:drift1 16s ease-in-out infinite alternate}
.orb.o2{width:520px;height:520px;right:240px;top:360px;background:rgba(120,150,170,.12);animation:drift2 19s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(220px,90px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-200px,-110px)}}
.uline{width:260px;height:3px;border-radius:2px;background:var(--accent);margin-top:40px;transform:scaleX(0);transition:transform 1s var(--ease);transition-delay:var(--d,0s)}
.uline.on{transform:scaleX(1)}
.team{margin-top:70px;display:flex;flex-direction:column;gap:12px;font-size:30px;font-weight:600;color:var(--text)}
.team span{display:inline-block;width:190px;text-align:right;margin-right:22px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.hl{position:relative;display:inline-block}
.hl::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;border-radius:3px;background:var(--accent);opacity:.85;transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease) .9s}
.on .hl::after,.hl.on::after{transform:scaleX(1)}
.floaty{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-14px) rotate(.4deg)}}
.nudge{display:inline-block;color:var(--accent);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}

/* 2. 계기 */
#threads{position:absolute;left:170px;top:50%;width:600px;transform:translateY(-50%)}
#threads .tilt{transform-origin:center;}
.pair{position:absolute;left:880px;right:110px}
.pair .k{font-size:30px;font-weight:600;color:var(--accent);margin-bottom:18px}
.pair .v{font-size:62px;white-space:nowrap;font-weight:700;letter-spacing:-0.01em;line-height:1.15}
.pair .rule{height:2px;background:var(--line);margin-bottom:40px;transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease);transition-delay:var(--d,0s)}
.pair .rule.on{transform:scaleX(1)}

/* 3. 영상 */
#vwrap{position:absolute;inset:0;background:#000}
#vwrap iframe{width:100%;height:100%;border:0;background:#000;pointer-events:none}

/* 4. 빈칸 */
.headline{position:absolute;left:0;right:0;top:150px;text-align:center}
.headline .label{margin-bottom:22px}
.headline .h{font-size:76px;font-weight:700;letter-spacing:-0.01em}
#loop{position:absolute;left:0;top:0;width:1920px;height:1080px}
#loop path{fill:none;stroke:#2E2E31;stroke-width:12;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .9s var(--ease);transition-delay:var(--d,0s)}
#loop path.on{stroke-dashoffset:0}
#loop polygon{fill:#4A4A4E;opacity:0;transition:opacity .3s;transition-delay:var(--d,0s)}
#loop polygon.on{opacity:1}
.node{position:absolute;top:470px;width:300px;height:150px;margin-left:-150px;border-radius:26px;background:var(--card);box-shadow:0 0 0 1.5px var(--edge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:box-shadow .6s var(--swap),background .6s var(--swap)}
.node .t{font-size:42px;font-weight:700}
.node{z-index:2}
.node.ping{box-shadow:0 0 0 2px var(--accent),0 0 60px rgba(174,198,176,.35)}
.node.filled.ping{box-shadow:0 0 0 3px var(--accent),0 0 120px rgba(174,198,176,.5)}
.node.burst{animation:burst .9s var(--ease)}
@keyframes burst{0%{transform:scale(1)}30%{transform:scale(1.08)}100%{transform:scale(1)}}
#drops ellipse{fill:var(--accent)}
.node .s{font-size:26px;font-weight:600;color:var(--note);margin-top:10px;height:34px;position:relative;width:100%;text-align:center}
.node .s span{position:absolute;left:0;right:0;transition:opacity .45s var(--swap)}
.node.gap{background:#000;box-shadow:none;border:2.5px dashed var(--line);animation:wait 1.6s ease-in-out infinite}
@keyframes wait{0%,100%{border-color:#48484A}50%{border-color:#8E8E93}}
.node.gap .t{color:var(--sub)}
.node.filled{background:#1D2420;box-shadow:0 0 0 2px var(--accent),0 0 80px rgba(174,198,176,.25);border-color:transparent}
.node.filled .t{color:var(--text)}
.node.filled .s .after{color:var(--accent)}
.gone{opacity:0 !important}
.foot{position:absolute;left:0;right:0;top:880px;text-align:center;font-size:40px;font-weight:700;color:var(--note)}
.foot b{color:var(--text);font-weight:700}

#hint{position:fixed;right:18px;bottom:14px;font-size:13px;color:#555;opacity:0;transition:opacity .4s}
body:not(.idle) #hint{opacity:1}
</style>
</head>
<body>
<div id="stage">

  <!-- 1. 표지 -->
  <section class="slide" data-steps="0">
    <div class="orb o1"></div><div class="orb o2"></div>
    <div class="glow"></div>
    <div class="center">
      <div class="label a sm" style="--d:.1s;margin-bottom:34px">주제 2 · AI 도구 소개</div>
      <div class="hero words" data-base=".25">Introducing Dreamina</div>
      <div class="uline" style="--d:1.0s"></div>
      <div class="sub a sm" style="--d:.9s;margin-top:34px">디지털미디어마케팅 트렌드 발표</div>
      <div class="team">
        <div class="a sm" style="--d:1.3s">김민영</div>
        <div class="a sm" style="--d:1.4s">김동훈</div>
        <div class="a sm" style="--d:1.5s">이희성</div>
      </div>
    </div>
  </section>

  <!-- 2. 계기 -->
  <section class="slide" data-steps="1">
    <div id="threads" class="a" style="--d:.1s"><div class="floaty">
      <blockquote class="text-post-media" data-text-post-permalink="https://www.threads.com/@choi.openai/post/De0mWlGj2RR" data-text-post-version="0" id="ig-tp-De0mWlGj2RR" style="background:#FFF;border-width:1px;border-style:solid;border-color:#00000026;border-radius:16px;max-width:650px;margin:1px;min-width:270px;padding:0;width:99.375%;width:calc(100% - 2px);"><a href="https://www.threads.com/@choi.openai/post/De0mWlGj2RR" style="background:#FFFFFF;line-height:0;padding:0 0;text-align:center;text-decoration:none;width:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;" target="_blank"><div style="padding:40px;display:flex;flex-direction:column;align-items:center;"><div style="font-size:15px;line-height:21px;color:#000000;font-weight:600;">Threads에서 보기</div></div></a></blockquote>
    </div></div>
    <div class="pair" style="top:330px">
      <div class="rule" style="--d:.35s"></div>
      <div class="k a sm" style="--d:.45s">계기</div>
      <div class="v a" style="--d:.5s">드리미나 <span class="hl">가격 오류</span></div>
    </div>
    <div class="pair" style="top:600px">
      <div class="rule" data-step="1" style="--d:0s"></div>
      <div class="k a sm" data-step="1" style="--d:.1s">주제 선정</div>
      <div class="v a" data-step="1" style="--d:.15s">광고 소재를 직접 만드는 도구</div>
    </div>
  </section>

  <!-- 3. 영상 -->
  <section class="slide" data-steps="0" id="vslide">
    <div id="vwrap"><iframe id="yt" title="Introducing Dreamina" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  </section>


  <!-- 4. 질의응답 -->
  <section class="slide" data-steps="0">
    <div class="orb o1"></div><div class="orb o2"></div>
    <div class="glow"></div>
    <div class="center">
      <div class="hero words" data-base=".15">Q&amp;A</div>
      <div class="sub a sm" style="--d:.5s;margin-top:40px;font-size:44px;color:var(--text);font-weight:600">감사합니다</div>
    </div>
  </section>

</div>
<div id="hint">→ 다음 · ← 이전 · F 전체 화면</div>
<script async src="https://www.threads.com/embed.js"></script>
<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
  addEventListener('resize',fit);fit();

  // 단어별로 떠오르게 나누기
  document.querySelectorAll('.words').forEach(function(el){
    var base=parseFloat(el.dataset.base||0);var ws=el.textContent.trim().split(/\s+/);el.textContent='';
    ws.forEach(function(w,i){var s=document.createElement('span');s.className='a';s.style.setProperty('--d',(base+i*0.12)+'s');s.textContent=w;el.appendChild(s);if(i<ws.length-1)el.appendChild(document.createTextNode(' '));});
  });

  var slides=[].slice.call(document.querySelectorAll('.slide'));
  var cur=-1, step=0;

  // 유튜브
  var yt=document.getElementById('yt'), ytPlaying=false;
  var YT_SRC='https://www.youtube-nocookie.com/embed/dbqspbI4yoY?autoplay=1&rel=0&modestbranding=1&playsinline=1&enablejsapi=1&controls=0';
  function ytCmd(f){try{yt.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:[]}),'*');}catch(e){}}
  function ytStart(){yt.setAttribute('src',YT_SRC);ytPlaying=true;}
  function ytStop(){yt.removeAttribute('src');ytPlaying=false;}

  // ── 빈칸 장표: 관 속을 흐르는 방울
  var NS='http://www.w3.org/2000/svg', track=document.getElementById('track'), dropsG=document.getElementById('drops');
  var L=track?track.getTotalLength():0, nodes=[].slice.call(document.querySelectorAll('#gapslide .node'));
  var flow={on:false,run:false,raf:0,last:0,acc:0,count:0,startAt:0,ps:[]};
  var GAP=262, SPEED=360;
  function ping(at){nodes.forEach(function(n){if(+n.dataset.at===at){n.classList.add('ping');setTimeout(function(){n.classList.remove('ping');},260);}});}
  function spawn(){
    var e=document.createElementNS(NS,'ellipse'), big=(flow.count++%4===0);
    e.setAttribute('rx',big?13:9);e.setAttribute('ry',big?5.5:4);
    if(big)e.style.filter='drop-shadow(0 0 8px rgba(174,198,176,.95))';
    dropsG.appendChild(e);flow.ps.push({s:0,el:e,big:big,mode:flow.on});
  }
  function tick(ts){
    if(!flow.run)return;
    var dt=Math.min(.05,(ts-(flow.last||ts))/1000);flow.last=ts;
    if(ts>=flow.startAt){
      flow.acc+=dt;var iv=flow.on?.22:.42;
      while(flow.acc>=iv){flow.acc-=iv;spawn();}
    }
    for(var i=flow.ps.length-1;i>=0;i--){
      var p=flow.ps[i], s0=p.s; p.s+=SPEED*dt;
      if(!p.mode&&flow.on&&s0<GAP-60)p.mode=true;
      var lim=p.mode?L:GAP, op=1;
      if(!p.mode){op=Math.max(0,Math.min(1,(GAP-p.s)/70));}
      if(p.s>=lim||op<=0){p.el.remove();flow.ps.splice(i,1);continue;}
      if(p.big&&p.mode){[430,860,1290].forEach(function(at){if(s0<at&&p.s>=at)ping(at);});if(s0<L-4&&p.s>=L-8)ping(0);}
      var a=track.getPointAtLength(p.s), b=track.getPointAtLength(Math.min(L,p.s+2));
      var ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      p.el.setAttribute('transform','translate('+a.x.toFixed(1)+','+a.y.toFixed(1)+') rotate('+ang.toFixed(1)+')');
      p.el.style.opacity=op;
    }
    flow.raf=requestAnimationFrame(tick);
  }
  function flowStart(){flowStop();flow.run=true;flow.last=0;flow.acc=0;flow.startAt=performance.now()+2300;flow.raf=requestAnimationFrame(tick);}
  function flowStop(){flow.run=false;cancelAnimationFrame(flow.raf);flow.ps.forEach(function(p){p.el.remove();});flow.ps=[];flow.on=false;}

  function apply(){
    var s=slides[cur];
    s.querySelectorAll('.a,.rule,.uline,#loop > path,#loop > polygon').forEach(function(el){
      var need=el.dataset.step?parseInt(el.dataset.step):0;
      el.classList.toggle('on',step>=need);
    });
    if(s.id==='gapslide'){
      var m=document.getElementById('make'), filled=step>=1;
      m.classList.toggle('gap',!filled);m.classList.toggle('filled',filled);
      m.querySelector('.before').classList.toggle('gone',filled);
      m.querySelector('.after').classList.toggle('gone',!filled);
      if(filled&&!flow.on){m.classList.remove('burst');void m.offsetWidth;m.classList.add('burst');}
      flow.on=filled;
    }
  }
  function go(n,st){
    if(n<0||n>=slides.length)return;
    if(cur>=0&&cur!==n){
      var old=slides[cur];old.classList.remove('cur');
      if(old.id==='vslide')ytStop();
      if(old.id==='gapslide')flowStop();
      setTimeout(function(){if(slides.indexOf(old)!==cur){old.querySelectorAll('.on').forEach(function(e){e.classList.remove('on');});}},650);
    }
    var entering=cur!==n;cur=n;step=st||0;
    var s=slides[cur];
    if(entering){
      s.querySelectorAll('.on').forEach(function(e){e.classList.remove('on');});
      if(s.id==='vslide')ytStart();
      if(s.id==='gapslide')flowStart();
    }
    s.classList.add('cur');
    requestAnimationFrame(function(){requestAnimationFrame(apply);});
  }
  function next(){var max=parseInt(slides[cur].dataset.steps);if(step<max){step++;apply();}else go(cur+1,0);}
  function prev(){if(step>0){step--;apply();}else if(cur>0){go(cur-1,parseInt(slides[cur-1].dataset.steps));}}

  addEventListener('keydown',function(e){
    var k=e.key;
    if(k===' '&&slides[cur].id==='vslide'){e.preventDefault();ytCmd(ytPlaying?'pauseVideo':'playVideo');ytPlaying=!ytPlaying;return;}
    if(k==='ArrowRight'||k==='PageDown'||k==='Enter'||k===' '){e.preventDefault();next();}
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();prev();}
    else if(k==='f'||k==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
    else if(k==='Home'){go(0,0);}
  });
  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('#threads'))return;if(e.clientX<innerWidth*0.25)prev();else next();});

  var idleT;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){document.body.classList.add('idle');},1800);}
  addEventListener('mousemove',wake);wake();

  var h=parseInt((location.hash||'#1').slice(1))||1;
  go(Math.min(Math.max(h,1),slides.length)-1,0);
})();
</script>
</body>
</html>
